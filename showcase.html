<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase - Silver Fox</title>
    
    <!-- FIXED: Correct Google Font link -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('Background1.jpeg'); 
            background-size: cover; 
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            overflow-x: hidden;
        }

        /* HEADER SECTION */
        header { 
            display: flex; 
            align-items: center; 
            padding: 15px 30px; 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-small { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            overflow: hidden; 
            margin-right: 15px; 
            border: 1px solid rgba(255,255,255,0.5); 
        }

        .logo-small img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand h1 { 
            font-size: 0.9rem; 
            margin: 0; 
            letter-spacing: 4px; 
            text-transform: uppercase;
        }

        /* VIDEO GRID SECTION */
        .content { 
            padding: 60px 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            text-align: center; 
        }

        .section-title {
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 50px;
            color: #d1d1d1;
        }

        .video-grid {
            display: grid;
            /* Creates 3 columns on desktop, 1 on mobile */
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .video-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .video-item:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.4);
        }

        video {
            width: 100%;
            display: block;
            border-radius: 2px;
        }

        .video-label {
            margin-top: 15px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8e949a;
        }

        .back-home { 
            color: #fff; 
            text-decoration: none; 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 80px; 
            display: inline-block; 
            border: 1px solid rgba(255,255,255,0.3);
            padding: 12px 25px;
            transition: 0.3s;
        }

        .back-home:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-small"><img src="Logo1.jpeg" alt="Logo"></div>
        <div class="brand"><h1>Silver Fox Navigator</h1></div>
    </header>

    <div class="content">
        <h2 class="section-title">Visual Showcase</h2>

        <div class="video-grid">
            <!-- Video 1 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video1.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Alpha</div>
            </div>

            <!-- Video 2 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video2.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Bravo</div>
            </div>

            <!-- Video 3 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video3.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Charlie</div>
            </div>

            <!-- Video 4 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video4.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Delta</div>
            </div>

            <!-- Video 5 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video5.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Echo</div>
            </div>

            <!-- Video 6 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video6.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Foxtrot</div>
            </div>

            <!-- Video 7 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video7.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Golf</div>
            </div>

            <!-- Video 8 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video8.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project Hotel</div>
            </div>

            <!-- Video 9 -->
            <div class="video-item">
                <video controls muted loop playsinline>
                    <source src="video9.mp4" type="video/mp4">
                </video>
                <div class="video-label">Project India</div>
            </div>
        </div>

        <a href="index.html" class="back-home">Return to Home</a>
    </div>

</body>
</html>
