<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase - Silver Fox</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('Background1.jpeg'); 
            background-size: cover; 
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            overflow-x: hidden;
        }

        header { 
            display: flex; 
            align-items: center; 
            padding: 10px 25px; 
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .home-icon {
            text-decoration: none;
            color: #fff;
            font-size: 1.5rem;
            margin-right: 20px;
            padding-right: 20px;
            border-right: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }

        .home-icon:hover { color: #8e949a; }

        /* LOGO: Height locked to 50px */
        .logo-small { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            overflow: hidden; 
            margin-right: 15px; 
            border: 1px solid rgba(255,255,255,0.5); 
            flex-shrink: 0;
        }

        .logo-small img { width: 100%; height: 100%; object-fit: cover; }

        /* BANNER STRIP: To the right, same height as logo */
        .banner-strip {
            height: 50px;
            width: 320px;
            background: url('banner1.jpeg');
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Overlay to keep text readable */
        .banner-strip::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }

        .brand-text {
            position: relative;
            z-index: 2;
            margin: 0;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            white-space: nowrap;
            color: #fff;
        }

        /* CONTENT */
        .content { padding: 40px 20px; max-width: 1400px; margin: 0 auto; text-align: center; }
        .section-title { font-weight: 300; letter-spacing: 12px; text-transform: uppercase; margin-bottom: 20px; color: #d1d1d1; font-size: 1.5rem; }

        .contact-btn {
            display: inline-block;
            margin: 10px 0 50px 0;
            padding: 12px 35px;
            background: #fff;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 0.75rem;
            transition: 0.3s;
            border: 2px solid #fff;
        }

        .contact-btn:hover { background: transparent; color: #fff; transform: translateY(-3px); }

        /* 2x4 GRID */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px;
            margin-bottom: 80px;
        }

        .video-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        video { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 6px; }
        .video-label { margin-top: 10px; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #8e949a; }

        @media (max-width: 1024px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .video-grid { grid-template-columns: 1fr; }
            .banner-strip { width: 200px; } /* Shrinks on mobile */
            .brand-text { font-size: 0.6rem; letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="home-icon" title="Return Home">⌂</a>
        
        <div class="logo-small">
            <img src="Logo1.jpeg" alt="Logo">
        </div>

        <div class="banner-strip">
            <h1 class="brand-text">Silver Fox Navigator</h1>
        </div>
    </header>

    <div class="content">
        <h2 class="section-title">Visual Showcase</h2>

        <a href="mailto:silverfoxnavigator@outlook.com" class="contact-btn">Inquire for Work</a>

        <div class="video-grid">
            <div class="video-item"><video controls muted loop><source src="video1.mp4" type="video/mp4"></video><div class="video-label">Caves of the Lake District</div></div>
            <div class="video-item"><video controls muted loop><source src="video2.mp4" type="video/mp4"></video><div class="video-label">Mountains of Wales</div></div>
            <div class="video-item"><video controls muted loop><source src="video3.mp4" type="video/mp4"></video><div class="video-label">Mountains Of Scotland</div></div>
            <div class="video-item"><video controls muted loop><source src="video4.mp4" type="video/mp4"></video><div class="video-label">Mountains of England</div></div>
            <div class="video-item"><video controls muted loop><source src="video5.mp4" type="video/mp4"></video><div class="video-label">Clip 05</div></div>
            <div class="video-item"><video controls muted loop><source src="video6.mp4" type="video/mp4"></video><div class="video-label">Clip 06</div></div>
            <div class="video-item"><video controls muted loop><source src="video7.mp4" type="video/mp4"></video><div class="video-label">Clip 07</div></div>
            <div class="video-item"><video controls muted loop><source src="video8.mp4" type="video/mp4"></video><div class="video-label">Clip 08</div></div>
        </div>
    </div>

</body>
</html>
