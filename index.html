<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Fox Navigator</title>
    
    <!-- 1. CORRECTED FONT LINK -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', serif;
            
            /* 2. BACKGROUND STACK - FIXED SVG AND FILENAME */
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
                radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%),
                linear-gradient(180deg, rgba(13, 13, 13, 0.7) 0%, rgba(30, 25, 20, 0.9) 100%),
                url('Background1'); 
            
            background-size: 200px, cover, cover, cover;
            background-position: center;
            background-attachment: fixed;
            color: #d1d1d1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4rem 3rem;
            border: 1px solid rgba(142, 148, 154, 0.2); 
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            max-width: 500px;
            width: 85%;
            border-radius: 2px;
        }

        /* 3. LOGO STYLING - FIXED FILENAME */
        .logo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            margin-bottom: 30px;
            border-radius: 50%;
            border: 2px solid #8e949a;
            filter: contrast(1.1) brightness(0.9);
        }

        .text-group {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            font-size: 2.8rem;
            line-height: 1;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 4. JUSTIFIED NAVIGATOR WIDTH */
        h3 {
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            color: #8e949a;
            font-size: 1rem;
            margin: 15px 0 0 0;
            font-weight: normal;
            width: 100%;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #4a3b2b, transparent);
            margin: 25px auto;
        }

        p {
            line-height: 1.8;
            color: #888;
            font-size: 1rem;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo file is exactly 'Logo1' -->
        <img src="Logo1" class="logo" alt="Silver Fox Logo">
        
        <div class="text-group">
            <h1>Silver Fox</h1>
            <h3>
                <span>N</span><span>A</span><span>V</span><span>I</span><span>G</span><span>A</span><span>T</span><span>O</span><span>R</span>
            </h3>
        </div>
        
        <div class="divider"></div>
        
        <p>Guided by instinct.<br>Defined by the journey.</p>
    </div>

</body>
</html>
