<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Fox Navigator</title>
    
    <!-- FIXED: Correct Google Font link for Special Elite -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', serif;
            
            /* FIXED: Correct CSS background syntax */
            background: 
                radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%),
                linear-gradient(180deg, rgba(13, 13, 13, 0.4) 0%, rgba(0, 0, 0, 0.6) 100%),
                url('Background1.jpg');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #d1d1d1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            max-width: 420px;
            width: 85%;
            border-radius: 4px;
        }

        .logo-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid rgba(142, 148, 154, 0.5);
            margin-bottom: 30px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-size: 2.6rem;
            color: #fff;
            font-weight: normal;
        }

        h3 {
            text-transform: uppercase;
            color: #8e949a;
            font-size: 0.9rem;
            margin: 12px 0 0 0;
            letter-spacing: 0.7em;
            text-indent: 0.7em;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #4a3b2b;
            margin: 30px auto;
        }

        p {
            line-height: 1.8;
            color: #a1a1a1;
            font-size: 1rem;
            margin: 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ensure Logo1.jpg is in the same folder as this file -->
        <div class="logo-circle">
            <img src="Logo1.jpg" alt="Silver Fox Logo">
        </div>
        
        <div class="text-group">
            <h1>Silver Fox</h1>
            <h3>NAVIGATOR</h3>
        </div>
        
        <div class="divider"></div>
        
        <p>Guided by instinct.<br>Defined by the journey.</p>
    </div>

</body>
</html>
