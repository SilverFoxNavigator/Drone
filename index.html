<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Fox Navigator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }
        body {
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%),
                        linear-gradient(180deg, rgba(13, 13, 13, 0.2) 0%, rgba(0, 0, 0, 0.2) 100%),
                        url('Background1.jpeg');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
        }
        .container {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px;
            max-width: 420px; width: 85%; box-shadow: 0 0 60px rgba(0, 0, 0, 1);
        }
        .logo-circle { width: 250px; height: 250px; border-radius: 50%; border: 1px solid rgba(142, 148, 154, 0.5); margin-bottom: 30px; overflow: hidden; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        h1 { letter-spacing: 6px; text-transform: uppercase; margin: 0; font-size: 2.4rem; color: #fff; font-weight: 700; }
        h3 { text-transform: uppercase; color: #8e949a; font-size: 0.8rem; margin: 12px 0 30px 0; letter-spacing: 0.8em; text-indent: 0.8em; }
        
        /* NAVIGATION BUTTONS */
        .nav-links { display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 20px; }
        .btn {
            text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 12px; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase;
            transition: 0.3s; background: rgba(255,255,255,0.05);
        }
        .btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle"><img src="Logo1.jpeg" alt="Logo"></div>
        <h1>DRONE FOOTAGE</h1>
        <h3>RAW | NATURE | BEAUTY</h3>
        <div class="nav-links">
            <a href="showcase.html" class="btn">Showcase Work</a>
            <a href="aboutme.html" class="btn">About Me</a>
        </div>
    </div>
</body>
</html>
