<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Fox Navigator</title>
    
    <!-- RUGGED TYPEWRITER FONT -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', serif;
            
            /* BACKGROUND STACK */
            background: 
                /* Rugged Grain Texture */
                url("data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PScwIDAgMjAwIDIwMCcgeG1sbnM9J2h0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnJz48ZmlsdGVyIGlkPSdub2lzZUZpbHRlcic+PGZlVHVyYnVsZW5jZSB0eXBlPSdmcmFjdGFsTm9pc2UnIGJhc2VGcmVxdWVuY3k9JzAuNjUnIG51bU9jdGF2ZXM9JzMnIHN0aXRjaFRpbGVzPSdzdGl0Y2gnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbm9pc2VGaWx0ZXIpJy8+PC9zdmc+"),
                radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%),
                linear-gradient(180deg, rgba(13, 13, 13, 0.7) 0%, rgba(30, 25, 20, 0.9) 100%),
                /* BACKGROUND FILE */
                <img src="https://raw.githubusercontent.com/SilverFoxNavigator/Drone/refs/heads/main/Background1" alt="Drone Logo" width="200">; 
            
            background-size: 200px, cover, cover, cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #d1d1d1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border: 1px solid rgba(142, 148, 154, 0.2); 
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            max-width: 450px;
            width: 85%;
            border-radius: 2px;
        }

        .logo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            margin-bottom: 25px;
            border-radius: 50%;
            border: 2px solid #8e949a;
            /* Ensures logo doesn't disappear if background fails */
            background-color: #1a1a1a; 
        }

        .text-group {
            width: 100%;
        }

        h1 {
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            font-size: 2.6rem;
            line-height: 1.1;
            color: #ffffff;
        }

        /* FIXED NAVIGATOR WIDTH */
        h3 {
            text-transform: uppercase;
            color: #8e949a;
            font-size: 0.95rem;
            margin: 10px 0 0 0;
            font-weight: normal;
            /* Adjusted letter spacing to match Silver Fox width better */
            letter-spacing: 0.65em; 
            text-indent: 0.65em; /* Offsets the last letter's spacing for perfect centering */
            width: 100%;
            text-align: center;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #4a3b2b;
            margin: 25px auto;
        }

        p {
            line-height: 1.8;
            color: #888;
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO FILE -->
        <img src="https://raw.githubusercontent.com/SilverFoxNavigator/Drone/refs/heads/main/Logo1" alt="Drone Logo" width="200">
        
        <div class="text-group">
            <h1>Silver Fox</h1>
            <h3>NAVIGATOR</h3>
        </div>
        
        <div class="divider"></div>
        
        <p>Guided by instinct.<br>Defined by the journey.</p>
    </div>

</body>
</html>
