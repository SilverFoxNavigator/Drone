<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Fox Navigator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents unwanted scrolling */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            background-color: #0a0a0a;
            
            /* BACKGROUND LAYERS */
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
                radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%),
                linear-gradient(180deg, rgba(13, 13, 13, 0.7) 0%, rgba(30, 25, 20, 0.9) 100%),
                url('original-B74A522A-201F-4780-89B2-BE67E5B11609.jpeg');
            
            background-size: 200px, cover, cover, cover;
            background-position: center;
            background-attachment: fixed;
            color: #d1d1d1;
        }

        .container {
            text-align: center;
            background: rgba(15, 15, 15, 0.8); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 3rem 2rem;
            border: 1px solid rgba(142, 148, 154, 0.2); 
            box-shadow: 0 40px 100px rgba(0, 0, 0, 1);
            max-width: 400px;
            width: 80%;
            border-radius: 8px;
        }

        /* FIXED LOGO STYLING */
        .logo {
            width: 150px; /* Force small width */
            height: 150px; /* Keep it square */
            object-fit: cover; /* Ensure it doesn't stretch */
            margin-bottom: 20px;
            border-radius: 50%;
            border: 2px solid #8e949a;
            display: inline-block;
        }

        h1 {
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0;
            font-size: 2rem;
        }

        h3 {
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #8e949a;
            font-weight: 300;
            font-size: 0.8rem;
            margin: 10px 0 0 0;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #4a3b2b;
            margin: 20px auto;
        }

        p {
            line-height: 1.6;
            font-style: italic;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Using standard image tag for better control -->
        <img src="original-B74A522A-201F-4780-89B2-BE67E5B11609.jpeg" class="logo" alt="Silver Fox Logo">
        
        <h1>Silver Fox</h1>
        <h3>Navigator</h3>
        
        <div class="divider"></div>
        
        <p>Guided by instinct. <br>Defined by the journey.</p>
    </div>

</body>
</html>
